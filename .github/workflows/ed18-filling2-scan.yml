name: ed18 filling2 scan
on:
  push:
    paths:
      - '.github/workflows/ed18-filling2-scan.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Run V1.4 filling scan
        run: |
          python research/scan_ed18_finiteT_phase.py \
            --V-values "1.4" \
            --fillings "1.6666666666666667,2,2.3333333333333335" \
            --T 0.01 \
            --ti 0.4 --t1 0.2 --t2 0.2 \
            --Vp -0.1 --Vx -0.07 \
            --chi-threshold 100 \
            --thermal-samples 4 \
            --tau-points 17 \
            --out results/ed18_V14_fill2/ed18_V14_fill2.npz
      - name: Print channel blocks
        run: |
          python - <<'PY'
          import numpy as np
          p="results/ed18_V14_fill2/ed18_V14_fill2.npz"
          z=np.load(p,allow_pickle=False)
          fills=z["fillings"]; mats=z["thermal_chi_eigenvectors"]
          # phase script does not save full chi matrices, so recompute from saved eigendecomposition:
          evals=z["thermal_chi_eigenvalues"]
          vecs=z["thermal_chi_eigenvectors"]
          qn=["Gamma","Q"]
          channels=list(z["channels"])
          print("channels",channels)
          for i,n in enumerate(fills):
              print(f"\n=== filling={n:.12g}, Nf={int(z['n_particles'][i])} ===")
              for iq,qname in enumerate(qn):
                  U=vecs[i,0,iq]
                  lam=evals[i,0,iq]
                  chi=(U*lam[None,:])@U.conj().T
                  co=0.5*(chi[:4,:4]+chi[:4,:4].conj().T)
                  lc=0.5*(chi[4:,4:]+chi[4:,4:].conj().T)
                  ce,cv=np.linalg.eigh(co); le,lv=np.linalg.eigh(lc)
                  ci=int(np.argmax(ce)); li=int(np.argmax(le))
                  cw=np.abs(cv[:,ci])**2; lw=np.abs(lv[:,li])**2
                  print(f"{qname}: chi_CO={ce[ci]:.9g}, weights_CO={cw}")
                  print(f"{qname}: chi_LC={le[li]:.9g}, weights_LC={lw}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ed18-V14-fill2
          path: results/ed18_V14_fill2/
