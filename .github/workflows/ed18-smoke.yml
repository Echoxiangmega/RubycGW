name: ed18 coarse smoke
on:
  push:
    paths:
      - '.github/workflows/ed18-smoke.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Run ED18 smoke grid
        run: |
          python research/scan_ed18_finiteT_phase.py \
            --V-values "0.4,1.0,1.4,1.8" \
            --fillings "1,2,3" \
            --T 0.01 \
            --ti 0.4 --t1 0.2 --t2 0.2 \
            --Vp -0.1 --Vx -0.07 \
            --chi-threshold 20 \
            --thermal-samples 1 \
            --tau-points 9 \
            --out results/ed18_phase_T001/ed18_smoke.npz
      - name: Print CSV
        if: always()
        run: |
          if [ -f results/ed18_phase_T001/ed18_smoke.csv ]; then cat results/ed18_phase_T001/ed18_smoke.csv; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ed18-smoke
          path: results/ed18_phase_T001/
