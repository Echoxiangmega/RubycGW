name: apply-ed12-paired-correlation-fix

on:
  push:
    branches:
      - ed12-paired-correlation-fix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ed12-paired-correlation-fix
          fetch-depth: 0
      - name: Apply patch
        run: |
          git apply .github/ed12_paired_fix.patch
          rm .github/ed12_paired_fix.patch
          rm .github/workflows/apply_ed12_paired_fix.yml
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix paired ED imaginary-time correlations"
          git push origin HEAD:ed12-paired-correlation-fix
