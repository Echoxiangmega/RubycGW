name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Archived research drivers remain importable for legacy regression tests
      # without putting them back in the repository root.
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Compile maintained and archived Python modules
        run: python -m compileall -q rubycgw scripts research vprime_study
      - run: python -m pytest -q
