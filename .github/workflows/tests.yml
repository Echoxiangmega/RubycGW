name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile run_ruby_cgw.py scan_primitive_cgw_q.py scan_primitive_cgw_q_tail.py inspect_finite_q_npz.py scan_ed18_vs_V.py scan_ed18_finiteT_vs_V.py scan_ed_cluster_vs_V.py benchmark_ed18_cgw.py benchmark_ed18_cgw_tail.py augment_ed18_cgw_full_tau.py augment_ed18_cgw_full_tau_tail.py validate_cgw_finite_source.py validate_cgw_discrete_fdt.py validate_cgw_tail_fdt.py decompose_ed18_cgw_stages.py decompose_ed18_cgw_stages_tail.py decompose_ed12_cgw_stages.py diagnose_ed18_cgw_fixed_modes.py diagnose_ed18_cgw_fixed_modes_tail.py diagnose_ed12_four_layer.py plot_ed12_four_layer.py plot_ed18_scan.py plot_ed18_chi.py convergence_scan.py filling_scan.py run_supercell_gw.py run_supercell_cgw.py run_supercell_cgw_tail.py scan_supercell_cgw_vs_V.py scan_supercell_cgw_vs_V_tail.py run_supercell_lc_branch.py search_supercell_branches.py compare_supercell_free_energy.py inspect_supercell_checkpoint.py plot_supercell_bands.py plot_supercell_order_realspace.py interpolate_supercell_checkpoint.py interpolate_supercell_checkpoint_T.py diagnose_nomega_seam.py diagnose_w_split_cutoff.py analyze_orbital_moment.py analyze_em_response.py analyze_bulk_magnetization.py analyze_pseudospin_susceptibility.py
      - run: python -m pytest -q
