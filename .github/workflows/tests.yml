name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile run_ruby_cgw.py convergence_scan.py filling_scan.py run_supercell_gw.py run_supercell_cgw.py plot_supercell_bands.py interpolate_supercell_checkpoint.py diagnose_nomega_seam.py diagnose_w_split_cutoff.py
      - run: python -m pytest -q
