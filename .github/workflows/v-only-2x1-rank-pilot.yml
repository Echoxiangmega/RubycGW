name: Ruby V-only 2x1 rank pilot

on:
  # Run once when this workflow is first added; subsequent edits to the
  # numerical driver do not retrigger this expensive experiment.
  push:
    paths:
      - .github/workflows/v-only-2x1-rank-pilot.yml
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install RubycGW
        run: python -m pip install -e .
      - name: Run same-torus ED and full cGW (2x1, V=0.6)
        run: |
          python research/diagnose_v_only_vertex_rank.py \
            --L1 2 --L2 1 --V 0.6 --T 0.08 --filling 3 \
            --nw 28 --nomega 7 --gw-max-iter 140 \
            --vertex-max-iter 150 \
            --out results/v_only_vertex_rank_pilot
      - name: Analyze direct physical response correction
        run: |
          python research/analyze_v_only_response_rank.py \
            results/v_only_vertex_rank_pilot/V_0.6/rank_diagnostic.npz \
            --out results/v_only_response_rank_pilot
      - name: Persist diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruby-v-only-2x1-rank-pilot
          path: |
            results/v_only_vertex_rank_pilot/
            results/v_only_response_rank_pilot/
          if-no-files-found: warn
