[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rubycgw"
version = "0.1.0"
description = "Research code for interacting electrons on the Ruby lattice: GW, covariant response, cluster ED+GW, and effective pseudospin models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
docs = [
  "sphinx>=7.2,<9",
  "pydata-sphinx-theme>=0.15,<0.17",
  "myst-parser>=2.0,<5",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rubycgw*", "vprime_study*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
